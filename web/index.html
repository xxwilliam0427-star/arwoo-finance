<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arwoo 财务助手</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🐣</div>
    <div>
      <div class="brand-name">Arwoo 财务助手</div>
      <div class="brand-sub">三池记账 · 分板块报表</div>
    </div>
  </div>

  <div class="topnet" id="topAssets"></div>

  <nav class="tabs" id="nav">
    <button class="tab" data-tab="overview">总览</button>
    <button class="tab" data-tab="ledger">记账</button>
    <button class="tab" data-tab="import">截图导入</button>
    <button class="tab" data-tab="accounts">账户</button>
    <button class="tab" data-tab="reports">报表</button>
    <button class="tab" data-tab="settings">设置</button>
  </nav>
</header>

<main id="view"></main>

<div class="loading" id="loading">正在读取数据…</div>
<div class="toast hidden" id="toast"></div>

<div class="modal hidden" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="icon-btn" id="modalClose" type="button" title="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <div class="form-error" id="modalError"></div>
      <div class="modal-foot-btns">
        <button class="btn ghost" id="modalCancel" type="button">取消</button>
        <button class="btn primary" id="modalOk" type="button">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/ocr.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
