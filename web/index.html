<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arwoo 财务助手</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="studio.css">
</head>
<body>

<aside class="topbar" aria-label="应用导航">
  <div class="brand">
    <div class="logo" aria-hidden="true">a<span>✦</span></div>
    <div>
      <div class="brand-name">Arwoo<span class="brand-dot">.</span></div>
      <div class="brand-sub">让每一笔钱，都有方向</div>
    </div>
  </div>

  <div class="nav-caption">我的财务空间</div>
  <nav class="tabs" id="nav" aria-label="主导航">
    <button class="tab" data-tab="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>总览</span><span class="nav-arrow">›</span></button>
    <button class="tab" data-tab="ledger"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h4"/></svg><span>记账</span><span class="nav-arrow">›</span></button>
    <button class="tab" data-tab="import"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m3 16 5-5 5 5 3-3 5 5M15 7h.01"/></svg><span>截图导入</span><span class="nav-arrow">›</span></button>
    <button class="tab" data-tab="accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7V5a2 2 0 0 0-2-2H6a3 3 0 0 0 0 6h14v12H6a3 3 0 0 1-3-3V6"/><path d="M20 12h-5v5h5M16 14.5h.01"/></svg><span>账户</span><span class="nav-arrow">›</span></button>
    <button class="tab" data-tab="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h17M7 16v-5M12 16V4M17 16V8"/></svg><span>报表</span><span class="nav-arrow">›</span></button>
    <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="16" cy="17" r="3"/></svg><span>设置</span><span class="nav-arrow">›</span></button>
  </nav>
  <div class="sidebar-note"><div class="local-light"></div><div><strong>本地财务空间</strong><span>数据由你掌握</span></div><span class="sidebar-spark">✧</span></div>
  <div class="sidebar-footer">ARWOO FINANCE <span>个人财务助手</span></div>
</aside>

<div class="workspace">
  <header class="workspace-header">
    <div class="breadcrumb">我的空间 <span>/</span> <strong id="pageLabel">总览</strong></div>
    <div class="header-actions"><span class="local-status"><i></i> 本地保存</span><button class="btn primary" data-act="add-tx">＋ 记一笔</button></div>
  </header>
  <div class="topnet" id="topAssets"></div>
  <main id="view"></main>
  <footer class="workspace-footer">从容管理，稳步积累。<span>Arwoo · 你的个人财务空间</span></footer>
</div>

<div class="loading" id="loading">正在读取数据…</div>
<div class="toast hidden" id="toast"></div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modalTitle">标题</h3>
      <button class="icon-btn" id="modalClose" type="button" title="关闭">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <div class="form-error" id="modalError"></div>
      <div class="modal-foot-btns">
        <button class="btn ghost" id="modalCancel" type="button">取消</button>
        <button class="btn primary" id="modalOk" type="button">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/ocr.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
